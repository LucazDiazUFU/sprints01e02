services:
  inventario:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - dados:/app/dados
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  dados:
