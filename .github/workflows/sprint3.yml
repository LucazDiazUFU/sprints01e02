name: Sprint 3 - testes e qualidade
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check trabalho2 sprint3 tests/test_trabalho2.py tests/test_sprint3.py main_trabalho2.py scripts
      - run: python -m flake8 trabalho2 sprint3 tests/test_trabalho2.py tests/test_sprint3.py main_trabalho2.py scripts
      - run: python -m pylint trabalho2 sprint3 main_trabalho2.py scripts
      - run: python -m coverage run --source=trabalho2,sprint3 -m pytest -q
      - run: python -m coverage report -m
  container:
    runs-on: ubuntu-latest
    env:
      DB_NAME: trabalho02_ci
      DB_USER: trabalho02_ci
      DB_PASSWORD: senha_apenas_para_ci_local
      DB_ROOT_PASSWORD: outra_senha_apenas_para_ci
      INVENTARIO_TOKEN: token_apenas_para_ci_com_mais_de_32_caracteres
    steps:
      - uses: actions/checkout@v6
      - run: docker compose -f compose.completo.yaml up --build -d --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:5000/api/saude
      - if: always()
        run: docker compose -f compose.completo.yaml logs --tail 100
      - if: always()
        run: docker compose -f compose.completo.yaml down
